{% extends "admin/change_list.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Скрытие блока быстрых действий с выделенными объектами */
    #changelist .actions,
    #changelist-form .actions,
    .changelist-form-container .actions {
        display: none !important;
    }

    /* Скрытие checkbox колонки для массовых действий */
    #result_list th:first-child,
    #result_list td:first-child {
        display: none !important;
    }

    /* Скрытие формы массовых действий */
    #changelist-form input[type="checkbox"] {
        display: none !important;
    }
</style>
{% endblock %}

{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{# Полностью убираем блок кнопок unfold #}
{% block footer %}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* АГРЕССИВНО убираем всё что связано с кнопками unfold */
    footer,
    #submit-row,
    .submit-row,
    [id*="submit"],
    [class*="submit-row"],
    [class*="submit"] {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
    }

    /* РАСТЯГИВАЕМ на всю ширину - убираем все ограничения */
    #content,
    #content-main,
    #content > *,
    #content-main > *,
    .container {
        max-width: 100% !important;
        width: 100% !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    /* Убираем двухколоночный layout */
    #content.colM,
    #content.colM > * {
        display: block !important;
        width: 100% !important;
    }

    /* Убираем любые sidebar/side колонки */
    aside,
    .sidebar,
    [class*="sidebar"],
    [class*="side-"] {
        display: none !important;
    }

    /* Кнопка Записать над формой */
    .compact-submit-row {
        padding: 12px 20px;
        margin: 0 0 20px 0;
        background: #e8f5e9;
        border: 1px solid #4caf50;
        border-radius: 6px;
        display: flex !important;
        justify-content: flex-start;
        gap: 10px;
        width: 100%;
        box-sizing: border-box;
    }

    .compact-submit-row input[type="submit"] {
        font-size: 14px;
        font-weight: 600;
        padding: 10px 30px;
        height: auto;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        flex: 0 0 auto;
        transition: background 0.2s;
    }

    .compact-submit-row input[type="submit"]:hover {
        background: #45a049;
    }
</style>
{% endblock %}

{# ТОЛЬКО кнопка Записать над формой #}
{% block form_before %}
<div class="compact-submit-row">
    <input type="submit" name="_save" value="Записать" class="default">
</div>
{% endblock %}

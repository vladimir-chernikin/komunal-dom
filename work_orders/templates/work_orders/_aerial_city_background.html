<svg class="city-3d-background" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">

            <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">

        </radialGradient>

        <filter id="buildingShadowFilter" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="3" dy="3" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

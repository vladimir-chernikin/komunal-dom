server {
    listen 80;
    listen [::]:80;
    server_name new.komunal-dom.ru;

    location = /health {
        default_type application/json;
        return 200 '{"status":"bootstrap","project":"komunal-dom-b"}';
    }

    location / {
        default_type text/plain;
        return 503 'Коммуналка Б: каркас создан, приложение еще не развернуто.\n';
    }
}


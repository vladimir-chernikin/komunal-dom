{% extends "admin/base_site.html" %}

{% load static %}

{% block title %}{{ title }} - {{ site_title }}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
	<style>
	    :root {
	        --llm-page: #eef5f1;
	        --llm-card: rgba(248, 251, 247, 0.96);
	        --llm-panel: rgba(229, 239, 233, 0.94);
	        --llm-line: rgba(71, 108, 92, 0.26);
	        --llm-panel-line: rgba(61, 96, 80, 0.28);
	        --llm-shadow: rgba(15, 23, 42, 0.09);
	        --llm-text: #13231d;
	        --llm-heading: #102d21;
	        --llm-body: #233f34;
	        --llm-muted: #456157;
	        --llm-strong: #0d261c;
	        --llm-link: #047857;
	        --llm-accent: #059669;
	        --llm-accent-soft: rgba(5, 150, 105, 0.15);
	        --llm-button: #c9eadb;
	        --llm-button-text: #064e3b;
	        --llm-button-border: rgba(4, 120, 87, 0.34);
	        --llm-secondary-button: #465f56;
	        --llm-table-head: rgba(217, 232, 224, 0.92);
	        --llm-row-hover: rgba(5, 150, 105, 0.09);
	    }
	    body {
	        color: var(--llm-text);
	    }
	    .llm-tester-container {
	        padding: 20px;
	        color: var(--llm-text);
	    }
	    .llm-tester-container h1 {
	        color: var(--llm-heading);
	        font-weight: 700;
	        letter-spacing: 0;
	    }
	    .llm-tester-card {
	        background: var(--llm-card);
	        border: 1px solid var(--llm-line);
	        border-radius: 8px;
	        box-shadow: 0 10px 28px var(--llm-shadow);
	        padding: 20px;
	        margin-bottom: 20px;
	    }
	    .llm-tester-card h3 {
	        margin-top: 0;
	        color: var(--llm-heading);
	        border-bottom: 2px solid var(--llm-accent);
	        padding-bottom: 10px;
	        font-weight: 700;
	        letter-spacing: 0;
	    }
	    .form-group {
	        margin-bottom: 15px;
	    }
    .form-group label {
	        display: block;
	        font-weight: 700;
	        margin-bottom: 5px;
	        color: var(--llm-strong);
	    }
	    .form-control {
	        width: 100%;
	        padding: 8px 12px;
	        border: 1px solid var(--llm-panel-line);
	        border-radius: 4px;
	        font-size: 14px;
	        color: var(--llm-text);
	        background: #fbfdfb;
	    }
	    .form-control:focus {
	        outline: none;
	        border-color: var(--llm-accent);
	        box-shadow: 0 0 0 3px var(--llm-accent-soft);
	    }
    textarea.form-control {
        min-height: 100px;
        font-family: 'Courier New', monospace;
        resize: vertical;
    }
    .btn {
        display: inline-block;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
	        cursor: pointer;
	        font-size: 14px;
	        font-weight: 700;
	        text-decoration: none;
	        transition: background-color 0.3s, border-color 0.3s, color 0.3s;
	    }
	    .btn-primary {
	        background-color: var(--llm-button);
	        border: 1px solid var(--llm-button-border);
	        box-shadow: inset 0 -1px 0 rgba(4, 120, 87, 0.16);
	        color: var(--llm-button-text);
	    }
	    .btn-primary:hover {
	        background-color: #b9e1cf;
	        border-color: rgba(4, 120, 87, 0.48);
	        color: #043f30;
	    }
	    .btn-success {
	        background-color: var(--llm-button);
	        border: 1px solid var(--llm-button-border);
	        color: var(--llm-button-text);
	    }
	    .btn-success:hover {
	        background-color: #b9e1cf;
	        color: #043f30;
	    }
	    .btn-secondary {
	        background-color: var(--llm-secondary-button);
	        color: white;
	        border: 1px solid var(--llm-secondary-button);
	    }
	    .btn-secondary:hover {
	        background-color: #394f47;
	        border-color: #394f47;
	    }
    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
	    .CodeMirror {
	        border: 1px solid var(--llm-panel-line);
	        border-radius: 4px;
	        height: auto;
	        min-height: 200px;
	    }
	    .response-area {
	        background-color: var(--llm-panel);
	        border: 1px solid var(--llm-panel-line);
	        border-radius: 4px;
	        padding: 15px;
	        min-height: 200px;
        white-space: pre-wrap;
	        font-family: 'Courier New', monospace;
	        font-size: 13px;
	        color: var(--llm-body);
	    }
	    .usage-info {
	        background-color: rgba(201, 234, 219, 0.72);
	        border: 1px solid var(--llm-button-border);
	        border-radius: 4px;
	        padding: 10px;
	        margin-top: 10px;
	        font-size: 13px;
	        color: var(--llm-body);
	    }
    .template-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }
	    .template-card {
	        background: var(--llm-panel);
	        border: 1px solid var(--llm-panel-line);
	        border-radius: 6px;
	        padding: 15px;
	        transition: box-shadow 0.3s;
	    }
	    .template-card h4 {
	        color: var(--llm-heading);
	        font-weight: 700;
	        letter-spacing: 0;
	    }
	    .template-card a:not(.btn) {
	        color: var(--llm-link) !important;
	    }
	    .template-card p {
	        color: var(--llm-body);
	    }
	    .template-card strong {
	        color: var(--llm-strong);
	    }
	    .template-card:hover {
	        box-shadow: 0 10px 24px var(--llm-shadow);
	    }
    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
	        font-weight: 700;
	    }
	    .badge-filter {
	        background-color: #0e7490;
	        color: white;
	    }
	    .badge-main {
	        background-color: var(--llm-accent);
	        color: white;
	    }
	    .badge-custom {
	        background-color: #64748b;
	        color: white;
	    }
	    .badge-success {
	        background-color: var(--llm-accent);
	        color: white;
	    }
	    .badge-secondary {
	        background-color: #64748b;
	        color: white;
	    }
    .alert {
        padding: 12px 16px;
        border-radius: 4px;
        margin-bottom: 15px;
    }
    .alert-success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
    }
    .alert-error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
    }
	    .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
	        border: 3px solid var(--llm-panel);
	        border-top: 3px solid var(--llm-accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .variable-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
    }
	    .results-table {
	        width: 100%;
	        border-collapse: collapse;
	        color: var(--llm-body);
	    }
	    .results-table th,
	    .results-table td {
	        padding: 12px;
	        text-align: left;
	        border-bottom: 1px solid var(--llm-panel-line);
	        color: var(--llm-body);
	    }
	    .results-table th {
	        background-color: var(--llm-table-head);
	        color: var(--llm-strong);
	        font-weight: 700;
	    }
	    .results-table tr:hover {
	        background-color: var(--llm-row-hover);
	    }
	    .llm-tester-container p,
	    .llm-tester-container td,
	    .llm-tester-container code,
	    .llm-tester-container .text-muted {
	        color: var(--llm-body) !important;
	    }
	</style>
{% endblock %}

{% block content %}
<div class="llm-tester-container">
    {% block content_inner %}{% endblock %}
</div>
{% endblock %}

{% block extrafoot %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
{% endblock %}
